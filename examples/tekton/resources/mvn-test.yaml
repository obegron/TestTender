apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: mvn-test
spec:
  params:
    - name: contextDir
      type: string
  workspaces:
    - name: source
  steps:
    - name: step-mvn-test
      image: gcr.io/cloud-builders/mvn
      workingDir: $(workspaces.source.path)/$(params.contextDir)
      command:
        - /usr/bin/mvn
      args:
        - test
      env:
        - name: DOCKER_HOST
          value: tcp://testtender:2475
        - name: TESTCONTAINERS_RYUK_DISABLED
          value: "true"
        - name: TESTCONTAINERS_CHECKS_DISABLE
          value: "true"
      resources: {}
