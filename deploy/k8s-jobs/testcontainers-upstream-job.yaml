apiVersion: batch/v1
kind: Job
metadata:
  name: testtender-upstream-tests
  namespace: testtender-system
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        testtender.io/client: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: runner
          image: testtender-test-runner:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_HOST
              value: tcp://testtender:2475
            - name: TESTCONTAINERS_RYUK_DISABLED
              value: "true"
            - name: TESTCONTAINERS_CHECKS_DISABLE
              value: "true"
            - name: UPSTREAM_TC_TASK
              value: :testcontainers:test
            - name: UPSTREAM_TC_TEST_ARGS
              value: --tests org.testcontainers.containers.ContainerStateTest
            - name: UPSTREAM_TC_EXTRA_GRADLE_ARGS
              value: --rerun-tasks --max-workers=1 --no-daemon
            - name: UPSTREAM_TC_EXPECTED_TESTS
              value: "6"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
