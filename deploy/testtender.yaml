apiVersion: v1
kind: ServiceAccount
metadata:
  name: testtender-control
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: testtender-worker
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: testtender-control
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: testtender-control
subjects:
  - kind: ServiceAccount
    name: testtender-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: testtender-control
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testtender-image-policy
data:
  policy.json: |
    {
      "version": "v1",
      "defaultAction": "deny",
      "rules": []
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: testtender-worker-template
data:
  pod.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels: {}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: main
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: testtender
  labels:
    app.kubernetes.io/name: testtender
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: testtender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: testtender
    spec:
      serviceAccountName: testtender-control
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: testtender
          image: ghcr.io/obegron/testtender:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - --pre-archive
            - --reverse-proxy
            - --namespace=$(POD_NAMESPACE)
            - --service-account=testtender-worker
            - --pod-template=/etc/testtender/pod-template/pod.yaml
            - --image-policy-file=/etc/testtender/image-policy/policy.json
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: docker-api
              containerPort: 2475
          readinessProbe:
            tcpSocket:
              port: docker-api
          livenessProbe:
            tcpSocket:
              port: docker-api
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: image-policy
              mountPath: /etc/testtender/image-policy
              readOnly: true
            - name: worker-template
              mountPath: /etc/testtender/pod-template
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: image-policy
          configMap:
            name: testtender-image-policy
        - name: worker-template
          configMap:
            name: testtender-worker-template
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: testtender
  labels:
    app.kubernetes.io/name: testtender
spec:
  selector:
    app.kubernetes.io/name: testtender
  ports:
    - name: docker-api
      port: 2475
      targetPort: docker-api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: testtender-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: testtender
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              testtender.io/client: "true"
        - podSelector:
            matchExpressions:
              - key: tekton.dev/pipelineRun
                operator: Exists
      ports:
        - protocol: TCP
          port: 2475
