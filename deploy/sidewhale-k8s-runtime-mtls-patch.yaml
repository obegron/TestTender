apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidewhale
  namespace: sidewhale-system
spec:
  template:
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: sidewhale
          args:
            - --listen
            - :23750
            - --listen-unix
            - "-"
            - --state-dir
            - /var/lib/sidewhale
            - --runtime-backend
            - k8s
            - --enable-image-mutations=false
            - --tls-cert
            - /etc/sidewhale/tls/server.crt
            - --tls-key
            - /etc/sidewhale/tls/server.key
            - --tls-client-ca
            - /etc/sidewhale/tls/client-ca.crt
          readinessProbe:
            httpGet: null
            tcpSocket:
              port: 23750
          startupProbe:
            tcpSocket:
              port: 23750
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: null
            tcpSocket:
              port: 23750
          volumeMounts:
            - name: tls
              mountPath: /etc/sidewhale/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: sidewhale-tls
            defaultMode: 0440
